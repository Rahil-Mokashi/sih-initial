# Experiment 01b: Band 2 alone, per-band normalization.
#
# Part of a four-point comparison against the epoch-39 baseline -- USE THE
# CORRECTED, nodata-masked, full-386-image-validation-set number: real
# oil-tiles-only IoU 0.1056, Dice 0.1666, Precision 0.1383, Recall 0.4800
# at threshold 0.35 (see docs/metric_audit.md). The originally-quoted
# 0.1074/0.169/0.139/0.476 was computed on an incomplete 344/386-image
# validation set (scripts/evaluate.py had a real cache-key collision bug,
# since fixed -- see that script's _cache_filename docstring) and without
# nodata masking; NOT re-trained, the corrected number is already measured.
# The other two trained arms are exp01a_band1_perband.yaml (Band 1 alone)
# and exp01c_both_perband.yaml (both bands, in_channels=2).
#
# This is a 15-epoch comparative ablation (lowered from 25), not a from-scratch reproduction
# of the 60-epoch baseline run: trains on data/processed/train_manifest_ablation.csv
# (all oil-containing tiles + an equal-count random zero-oil sample, seed 42,
# + all lookalike tiles -- see scripts/build_ablation_manifest.py; report
# its printed tile count/% for the exact figures), NOT the full
# train_manifest.csv. val_manifest is unchanged (all 386 images, full grid)
# so results stay directly comparable to the corrected baseline above.
# amp/channels_last are opt-in performance flags (see docs/colab.md or
# src/detection/train.py's _resolve_amp docstring) -- turning them on
# changes numerics slightly (see scripts/verify_amp.py's real batch-loss
# comparison) but is not expected to change conclusions.
#
# Every setting below is inherited UNCHANGED from configs/baseline.yaml
# except `channels` (Band 2 instead of Band 1 -- `in_channels` stays 1,
# still a single-channel model) and `normalization`, `seed`,
# `experiment_name`, and `output_dir`. See baseline.yaml for the
# provenance of every inherited value (pos_weight, learning_rate,
# batch_size, epochs, no scheduler, etc.).
#
# MUST PIN to a commit that includes commit 17a8845 ("Add config-driven
# training entrypoint + Colab reproducibility infra") or later -- the
# earlier c70349a's two-channel dataset read path was non-functional (see
# that commit's message and LOG.md's 2026-08-31 entry). run_manifest.json
# records whatever the actual HEAD SHA is at run time; confirm via
# `git merge-base --is-ancestor 17a8845 HEAD` that it descends from the fix
# before trusting a run's results.

experiment_name: exp01b_band2_perband

in_channels: 1
channels: [2]

sampling_strategy: none
oil_tile_fraction: null

pos_weight: 32.6

loss: dicebce
loss_parameters:
  dice_weight: 1.0
  bce_weight: 1.0

optimizer: adam
learning_rate: 0.001
weight_decay: 0.0

scheduler: none
scheduler_parameters: {}

batch_size: 16
grad_accum_steps: 1
num_workers: 6
epochs: 15  # comparative ablation on the subset manifest below, not the full 60-epoch baseline run (lowered from 25)
keep_last_n: 3

amp: true            # opt-in; see scripts/verify_amp.py for the real per-batch loss delta this makes
channels_last: true  # opt-in; torch.channels_last memory format for model + image batches

# Explicit seed (baseline.yaml has none -- no global seed was ever set for
# the original epoch-39 run, see its MANIFEST.json). This is a NECESSARY
# difference from epoch-39, not an oversight: without it this experiment
# itself wouldn't be reproducible, and there is no "epoch-39's seed" to
# match since none existed. Same seed used across all three exp01 arms so
# the ONLY difference between them is genuinely the input channels/
# normalization, not incidental RNG divergence.
seed: 42
deterministic: false

resume_from: null
output_dir: data/processed/checkpoints/exp01b_band2_perband

allow_dirty: false

tile_size: 512
lee_filter:
  window_size: 7

normalization:
  # Per-band range for Band 2 alone: its own empirical [p1, p99] in dB,
  # measured over a 40-image sample (see the metric_audit.md follow-up
  # verification) -- NOT the shared [-40, 10] baseline.yaml uses. This is
  # the one deliberate change from baseline for this arm.
  #
  # NODATA EXCLUDED: 1.81% of pixels in both bands are exactly 0.0 dB at
  # identical spatial locations in both bands (a real nodata mask, not
  # sensor clipping or a bright-target tail -- see LOG.md). The initial
  # [p1, p99] = (-33.821, 0.0) computation included these, so its upper
  # bound was sitting on the nodata plateau, not real signal. Recomputed
  # with exact-zero pixels dropped before taking percentiles.
  mode: fixed_range
  fixed_range:
    - [-33.862, -6.324]

augmentation:
  enabled: true
  flips: true
  rotations_90: true
  speckle_jitter_std_db: 0.5

dataset:
  # Tile-level ablation subset (see scripts/build_ablation_manifest.py) --
  # NOT the full train_manifest.csv. train.py's load_manifest() detects the
  # extra row_offset/col_offset columns and trains on exactly these
  # selected tiles instead of auto-tiling every listed image's full grid.
  train_manifest: data/processed/train_manifest_ablation.csv
  # val_manifest UNCHANGED: full 386-image validation set, full grid, so
  # results stay directly comparable to the corrected baseline (see header).
  val_manifest: data/processed/val_manifest.csv
  split_seed: 0
  val_fraction: 0.15
